name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already ship the Android SDK; just make sure its licences are accepted
      - id: sdk
        name: Use the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$RUNNER_TEMP/build.log"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - id: install
        name: Install
        run: npm ci 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - id: sync
        name: Copy the web app into the Android project
        run: npx cap sync android 2>&1 | tee -a "$RUNNER_TEMP/build.log"
        shell: bash -eo pipefail {0}

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLIPJOD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clipjod.keystore"
            echo "CLIPJOD_KEYSTORE=$RUNNER_TEMP/clipjod.keystore" >> "$GITHUB_ENV"
          fi

      - id: build
        name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CLIPJOD_STORE_PASSWORD: ${{ secrets.CLIPJOD_STORE_PASSWORD }}
          CLIPJOD_KEY_ALIAS: ${{ secrets.CLIPJOD_KEY_ALIAS }}
          CLIPJOD_KEY_PASSWORD: ${{ secrets.CLIPJOD_KEY_PASSWORD }}
        shell: bash -eo pipefail {0}
        run: |
          chmod +x gradlew
          if [ -n "$CLIPJOD_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ClipJod.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ClipJod.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ClipJod-apk
          path: ClipJod.apk

      - id: release
        name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash -eo pipefail {0}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ClipJod.apk \
            --title "ClipJod $TAG" \
            --notes "Android app. Download ClipJod.apk on your phone and open it to install. Android may ask you to allow installs from this source the first time." \
            --latest 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # keeps the last build's result and log on the ci-logs branch, so problems can be read without the Actions page
      - name: Save build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "no log" > build.log
          echo "run ${{ github.run_number }} on ${{ github.sha }}: ${{ job.status }}" > status.txt
          cat > steps.json <<'JSON'
          ${{ toJSON(steps) }}
          JSON
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
