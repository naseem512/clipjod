name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLIPJOD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clipjod.keystore"
            echo "CLIPJOD_KEYSTORE=$RUNNER_TEMP/clipjod.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CLIPJOD_STORE_PASSWORD: ${{ secrets.CLIPJOD_STORE_PASSWORD }}
          CLIPJOD_KEY_ALIAS: ${{ secrets.CLIPJOD_KEY_ALIAS }}
          CLIPJOD_KEY_PASSWORD: ${{ secrets.CLIPJOD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CLIPJOD_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ClipJod.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ClipJod.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ClipJod-apk
          path: ClipJod.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ClipJod.apk \
            --title "ClipJod $TAG" \
            --notes "Android app. Download ClipJod.apk on your phone and open it to install. Android may ask you to allow installs from this source the first time." \
            --latest
