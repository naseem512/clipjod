name: Publish web app

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy www/ to the gh-pages branch
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
